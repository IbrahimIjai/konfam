environment: local
network: testnet
docker_compose_path: ./docker-compose.yaml

agent_contract:
  contract_id:
  deploy_custom:
    enabled: true
    funding_amount: 8
    delete_key: false
    deploy_from_source:
      enabled: true
      source_path: ./contracts/escrow
      reproducible_build: false
    deploy_from_wasm:
      enabled: false
      wasm_path: ./contracts/target/near/konfam_escrow/konfam_escrow.wasm
    use_global_by_hash:
      enabled: false
      global_hash:
    init:
      enabled: true
      method_name: new
      args: |
        {
          "requires_tee": <REQUIRES_TEE>,
          "attestation_expiration_time_ms": <7_DAYS>,
          "owner_id": <MASTER_ACCOUNT_ID>,
          "token_id": "REPLACE_WITH_TOKEN_ACCOUNT",
          "token_decimals": 6,
          "fee_bps": 50,
          "fee_recipient": <MASTER_ACCOUNT_ID>,
          "payment_window_ms": "1800000",
          "release_grace_ms": "900000"
        }

approve_measurements:
  enabled: true
  method_name: approve_measurements
  args: |
    {
      "measurements": <MEASUREMENTS>
    }

approve_ppids:
  enabled: true
  method_name: approve_ppids
  args: |
    {
      "ppids": <PPIDS>
    }

build_docker_image:
  enabled: true
  tag: ibrahimijai/konfam-agent
  cache: true
  dockerfile_path: ./apps/agent/Dockerfile
  reproducible_build: false

deploy_to_phala:
  enabled: true
  app_name: konfam-agent
  env_file_path: ./.env
  dstack_version: 0.5.8
  instance_type: tdx.small
  public_logs: true
  public_sysinfo: true

whitelist_agent_for_local:
  method_name: whitelist_agent_for_local
  args: |
    {
      "account_id": <AGENT_ACCOUNT_ID>
    }
